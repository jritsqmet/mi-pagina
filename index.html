<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Sitio - Inicio</title>
    <!-- Latest compiled and minified CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        }

        body {
            background: #f4f6fb;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
        }

        /* Navbar mejorada */
        .navbar-custom {
            background: var(--primary-gradient);
            box-shadow: 0 4px 20px rgba(79, 70, 229, 0.25);
            padding: 0.8rem 0;
        }

        .navbar-custom .navbar-brand {
            font-weight: 700;
            font-size: 1.35rem;
            letter-spacing: -0.5px;
            color: #fff;
        }

        .navbar-custom .nav-link {
            color: rgba(255, 255, 255, 0.85) !important;
            font-weight: 500;
            padding: 0.5rem 1rem !important;
            border-radius: 8px;
            transition: all 0.25s ease;
            position: relative;
        }

        .navbar-custom .nav-link:hover:not(.disabled) {
            background: rgba(255, 255, 255, 0.15);
            color: #fff !important;
            transform: translateY(-2px);
        }

        .navbar-custom .nav-link.active {
            background: rgba(255, 255, 255, 0.2);
            color: #fff !important;
            font-weight: 600;
        }

        .navbar-custom .nav-link.disabled {
            color: rgba(255, 255, 255, 0.4) !important;
            cursor: not-allowed;
        }

        /* Hero / Video */
        .hero-section {
            padding: 3rem 1rem;
        }

        .video-card {
            background: #fff;
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            max-width: 800px;
            margin: 0 auto;
        }

        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 50px rgba(79, 70, 229, 0.15);
        }

        .video-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .video-title i {
            color: #4f46e5;
            font-size: 1.8rem;
        }

        .video-subtitle {
            color: #6b7280;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 */
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 2rem 1rem;
            color: #9ca3af;
            font-size: 0.875rem;
            margin-top: 2rem;
        }

        /* Animación de entrada */
        .fade-in {
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-sm navbar-custom navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-rocket-takeoff-fill me-2"></i>Mi Sitio
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navMenu">
                <ul class="navbar-nav gap-1">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">
                            <i class="bi bi-house-door-fill me-1"></i>Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="columnas.html">
                            <i class="bi bi-layout-three-columns me-1"></i>Columnas
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="tarjetas.html">
                            <i class="bi bi-card-heading me-1"></i>Tarjetas
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled" href="#" tabindex="-1" aria-disabled="true">
                            <i class="bi bi-lock-fill me-1"></i>Disabled
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido principal -->
    <section class="hero-section">
        <div class="container">
            <div class="video-card fade-in">
                <h1 class="video-title">
                    <i class="bi bi-play-circle-fill"></i>
                    Video destacado
                </h1>
                <p class="video-subtitle">Disfruta de nuestro contenido multimedia en alta calidad.</p>

                <div class="video-wrapper">
                    <iframe 
                        src="https://www.youtube.com/embed/NeQ2-FpHxHw?si=MLh0i58y1DaoSA7t"
                        title="YouTube video player"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        referrerpolicy="strict-origin-when-cross-origin"
                        allowfullscreen>
                    </iframe>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p class="mb-0">© 2024 Mi Sitio · Hecho con <i class="bi bi-heart-fill text-danger"></i> usando Bootstrap 5</p>
    </footer>

</body>

</html>
